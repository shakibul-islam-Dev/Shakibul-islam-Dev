name: 🔄 Daily GitHub Profile Refresh

on:

# Run automatically every day at 00:00 UTC

# Bangladesh time (UTC+6): 06:00 AM

schedule:
- cron: "0 0 * * *"

# Allow manual execution from GitHub Actions

workflow_dispatch:

# Allow GitHub Actions to update README.md

permissions:
contents: write

jobs:
refresh-profile:
name: 🚀 Refresh Profile Stats
runs-on: ubuntu-latest

```
steps:
  # ─────────────────────────────────────────────
  # 1. Checkout repository
  # ─────────────────────────────────────────────
  - name: 📥 Checkout repository
    uses: actions/checkout@v4

  # ─────────────────────────────────────────────
  # 2. Generate a unique daily cache version
  # ─────────────────────────────────────────────
  - name: 🕐 Generate cache version
    id: version
    shell: bash
    run: |
      VERSION=$(date -u +"%Y%m%d%H%M%S")
      echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      echo "Generated cache version: $VERSION"

  # ─────────────────────────────────────────────
  # 3. Replace cache version in README
  # ─────────────────────────────────────────────
  - name: 🔄 Update README cache version
    shell: bash
    run: |
      VERSION="${{ steps.version.outputs.version }}"

      sed -i \
        "s/PROFILE_CACHE_VERSION/$VERSION/g" \
        README.md

      echo "README cache version updated to: $VERSION"

  # ─────────────────────────────────────────────
  # 4. Check whether README changed
  # ─────────────────────────────────────────────
  - name: 🔍 Check for changes
    id: changes
    shell: bash
    run: |
      if git diff --quiet README.md; then
        echo "changed=false" >> "$GITHUB_OUTPUT"
        echo "No README changes detected."
      else
        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "README changes detected."
      fi

  # ─────────────────────────────────────────────
  # 5. Commit updated README
  # ─────────────────────────────────────────────
  - name: 💾 Commit changes
    if: steps.changes.outputs.changed == 'true'
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add README.md

      git commit \
        -m "chore: daily profile stats refresh"

  # ─────────────────────────────────────────────
  # 6. Push changes to GitHub
  # ─────────────────────────────────────────────
  - name: 🚀 Push changes
    if: steps.changes.outputs.changed == 'true'
    shell: bash
    run: |
      git push

  # ─────────────────────────────────────────────
  # 7. Finish
  # ─────────────────────────────────────────────
  - name: ✅ Complete
    shell: bash
    run: |
      echo "========================================="
      echo " GitHub Profile Refresh Completed"
      echo " Cache Version: ${{ steps.version.outputs.version }}"
      echo "========================================="
